<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <!-- Safe zone is the middle 72x72 -->
  <g transform="translate(18, 18)">
    <!-- Bus Body -->
    <rect x="12" y="12" width="48" height="48" rx="8" fill="#FFD700" />
    <!-- Windshield / Marquee -->
    <rect x="18" y="18" width="36" height="16" rx="2" fill="#1A1A1A" />
    <!-- Headlights -->
    <circle cx="20" cy="50" r="4" fill="#FFFFFF" />
    <circle cx="52" cy="50" r="4" fill="#FFFFFF" />
    <!-- Grill -->
    <rect x="30" y="48" width="12" height="4" rx="1" fill="#1A1A1A" />
    <!-- Wheels -->
    <circle cx="24" cy="60" r="6" fill="#1A1A1A" />
    <circle cx="48" cy="60" r="6" fill="#1A1A1A" />
    <!-- "When" Clock inside Windshield -->
    <circle cx="36" cy="26" r="5" fill="#FFFFFF" />
    <polyline points="36,23 36,26 39,26" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
